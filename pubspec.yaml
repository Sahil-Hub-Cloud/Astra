name: disha_mvp
description: "Disha Emergency SOS App - MVP Version"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 1. Location
  geolocator: ^10.1.0
  
  # 2. Permissions
  permission_handler: ^11.0.0
  
  # 3. SMS - Updated to modern package
  sms_advanced: ^1.1.0
  
  # 4. Making Calls
  url_launcher: ^6.2.1
  
  # 5. Local Storage (for contacts)
  shared_preferences: ^2.2.2
  
  # 6. Connectivity for offline functionality
  connectivity_plus: ^4.0.2
  
  # 7. Supabase Backend
  supabase_flutter: ^2.0.0
  
  # 8. WorkManager for background processing
  workmanager: ^0.5.1
  
  # 9. Path provider for shared storage
  path_provider: ^2.1.1
  
  # 10. Secure storage
  flutter_secure_storage: ^9.0.0
  
  # 11. Collection utilities
  collection: ^1.17.0

  # 12. GoRouter for navigation
  go_router: ^12.0.0

  # 13. Speech to text for voice activation
  speech_to_text: ^6.6.0

  # 14. Firebase for push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
